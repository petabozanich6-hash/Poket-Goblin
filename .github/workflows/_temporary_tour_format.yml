name: Format walkthrough browser test (temporary)
on:
  push:
    branches:
      - feature/one-time-guided-tour

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/one-time-guided-tour'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/tour.spec.ts
      - name: Save formatting to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- e2e/tour.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format walkthrough browser test"
            git push origin HEAD:feature/one-time-guided-tour
          fi
