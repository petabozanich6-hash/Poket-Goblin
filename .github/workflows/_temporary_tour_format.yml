name: Format guided tour branch (temporary)
on:
  push:
    branches:
      - feature/one-time-guided-tour

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feature/one-time-guided-tour'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the touched walkthrough files
        run: npx prettier --write src/features/tour/SiteTour.tsx src/features/tour/SiteTour.module.css src/pages/HomePage.tsx src/pages/SettingsPage.tsx worker/routes/me.ts worker/tour.test.ts
      - name: Save formatting to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/features/tour/SiteTour.tsx src/features/tour/SiteTour.module.css src/pages/HomePage.tsx src/pages/SettingsPage.tsx worker/routes/me.ts worker/tour.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to guided tour"
            git push origin HEAD:feature/one-time-guided-tour
          fi
