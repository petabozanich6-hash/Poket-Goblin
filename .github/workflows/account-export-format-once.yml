name: One-time account export format fix
on:
  push:
    branches: [feature/goblin-deals-mischief]
    paths: [.github/workflows/account-export-format-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goblin-deals-mischief
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format the two changed files
        run: npx prettier --write worker/account.test.ts worker/routes/account.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Commit fixes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/account.test.ts worker/routes/account.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(account): format support data export changes"
            git push origin HEAD:feature/goblin-deals-mischief
          fi
