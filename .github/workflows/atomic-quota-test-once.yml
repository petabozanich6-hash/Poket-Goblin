name: Atomic quota test
on:
  push:
    branches: [feat/restrict-free-tier-foundation]
    paths: [.github/workflows/atomic-quota-test-once.yml]
permissions:
  contents: read
jobs:
  quota-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run worker/freeQuota.test.ts worker/migrations.test.ts worker/goblin.test.ts
