name: One-time billing format
on:
  push:
    branches: [feat/stripe-multicurrency-prices]
    paths: [.github/workflows/billing-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stripe-multicurrency-prices
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/SubscriptionPage.tsx
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SubscriptionPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(billing): format local currency price note"
            git push origin HEAD:feat/stripe-multicurrency-prices
          fi
