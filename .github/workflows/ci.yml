name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TEMPORARY PR-ONLY formatting diagnostic; remove before merge.
      - name: Show exact module formatting changes
        run: |
          npx prettier --write shared/documents/moduleStudy.ts shared/documents/moduleStudy.test.ts shared/documents/pathwayPreview.ts worker/pathwayJourney.test.ts
          git diff -- shared/documents/moduleStudy.ts shared/documents/moduleStudy.test.ts shared/documents/pathwayPreview.ts worker/pathwayJourney.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Worker + assets bundle (dry run, no upload)
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run --var ENVIRONMENT:production 2>&1 | tee dry-run.log || {
            echo "::error title=wrangler dry run::$(tail -c 1500 dry-run.log | tr '\n' ' ')"
            exit 1
          }
