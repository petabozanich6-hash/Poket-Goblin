name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Temporary formatter output
        run: |
          npx prettier --write e2e/devourer.spec.ts src/features/documents/DocumentDevourer.tsx
          echo 'START_FORMATTED_E2E'
          base64 -w0 e2e/devourer.spec.ts
          echo
          echo 'END_FORMATTED_E2E'
          echo 'START_FORMATTED_COMPONENT'
          base64 -w0 src/features/documents/DocumentDevourer.tsx
          echo
          echo 'END_FORMATTED_COMPONENT'
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Worker + assets bundle (dry run, no upload)
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run --var ENVIRONMENT:production 2>&1 | tee dry-run.log || {
            echo "::error title=wrangler dry run::$(tail -c 1500 dry-run.log | tr '\n' ' ')"
            exit 1
          }
