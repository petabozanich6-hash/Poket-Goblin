name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TEMPORARY: output exact Prettier patch so this PR can be corrected.
      - name: Print calendar and approval formatting diff
        run: |
          npx prettier --write src/features/documents/DocumentDevourer.tsx src/features/documents/StudyPathwayPreviewPanel.tsx src/pages/CalendarPage.tsx worker/calendar.test.ts worker/lib/documents/pathwayApproval.ts worker/pathwayJourney.test.ts worker/routes/calendar.ts worker/routes/documents.ts e2e/study-pathway.spec.ts
          git diff -- src/features/documents/DocumentDevourer.tsx src/features/documents/StudyPathwayPreviewPanel.tsx src/pages/CalendarPage.tsx worker/calendar.test.ts worker/lib/documents/pathwayApproval.ts worker/pathwayJourney.test.ts worker/routes/calendar.ts worker/routes/documents.ts e2e/study-pathway.spec.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Worker + assets bundle (dry run, no upload)
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run --var ENVIRONMENT:production 2>&1 | tee dry-run.log || {
            echo "::error title=wrangler dry run::$(tail -c 1500 dry-run.log | tr '\n' ' ')"
            exit 1
          }
