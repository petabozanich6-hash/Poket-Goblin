name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: write

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Deals UI (temporary)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/deals-options-after-giveaways'
        run: |
          npx prettier --write src/pages/hq/HqDealsPage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/hq/HqDealsPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format Deals campaign UI with Prettier"
            git push origin HEAD:feature/deals-options-after-giveaways
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Worker + assets bundle (dry run, no upload)
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run --var ENVIRONMENT:production 2>&1 | tee dry-run.log || {
            echo "::error title=wrangler dry run::$(tail -c 1500 dry-run.log | tr '\n' ' ')"
            exit 1
          }
