name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: write

jobs:
  temporary-format:
    # Only on this same-repo draft PR, never for forks or other contributors.
    if: github.head_ref == 'feature/opt-in-web-push' && github.event.pull_request.head.repo.full_name == github.repository
    name: Temporary prettier pass (remove before merge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
        with:
          ref: feature/opt-in-web-push
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prettier changed files
        run: npx prettier --write docs/WEB_PUSH.md public/sw.js src/features/magical/NudgeTray.tsx src/features/pwa/PushControls.tsx worker/index.ts worker/lib/push.ts worker/push.test.ts worker/routes/push.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_PUSH.md public/sw.js src/features/magical/NudgeTray.tsx src/features/pwa/PushControls.tsx worker/index.ts worker/lib/push.ts worker/push.test.ts worker/routes/push.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(push): apply Prettier"
            git push origin HEAD:feature/opt-in-web-push
          fi

  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Worker + assets bundle (dry run, no upload)
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run --var ENVIRONMENT:production 2>&1 | tee dry-run.log || {
            echo "::error title=wrangler dry run::$(tail -c 1500 dry-run.log | tr '\n' ' ')"
            exit 1
          }
