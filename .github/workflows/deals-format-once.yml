name: One-time formatting repair (Goblin Deals)
on:
  push:
    branches: [feature/goblin-deals-mischief]
    paths: [.github/workflows/deals-format-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goblin-deals-mischief
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only files flagged by CI
        run: |
          npx prettier --write src/app/AppShell.tsx src/features/hq/hqApi.ts src/features/support/SupportNotice.tsx src/pages/hq/HqCostsPage.tsx src/pages/hq/HqDealsPage.tsx src/pages/hq/HqFeedbackPage.tsx src/pages/supportPage.tsx worker/lib/finance.ts worker/routes/admin.ts worker/routes/support.ts worker/support.test.ts
          # The actual filename is SupportPage.tsx (capital S).
        continue-on-error: true
      - name: Format corrected filename and verify
        run: |
          npx prettier --write src/pages/SupportPage.tsx
          npm run format:check
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src worker
          if ! git diff --cached --quiet; then
            git commit -m "style: format files reported by CI"
            git push origin HEAD:feature/goblin-deals-mischief
          fi
