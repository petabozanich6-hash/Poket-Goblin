name: One-time document quota formatting
on:
  push:
    branches: [feat/restrict-free-tier-foundation]
    paths: [.github/workflows/document-quota-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restrict-free-tier-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write worker/lib/freeQuota.ts worker/freeQuota.test.ts
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/lib/freeQuota.ts worker/freeQuota.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(quotas): format atomic document reservations"
            git push origin HEAD:feat/restrict-free-tier-foundation
          fi
