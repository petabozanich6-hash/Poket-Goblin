name: Format academic PDF regression once
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/format-academic-pdf-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write shared/documents/weeklyPathway.test.ts
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/documents/weeklyPathway.test.ts
            git commit -m "Format academic PDF study pathway regression"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
