name: Format linked pathway task safeguards once
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/format-linked-pathway-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write worker/routes/documents.ts worker/pathwayReplan.test.ts src/features/documents/StudyPathwayPreviewPanel.tsx src/features/explore/exploreApi.ts worker/lib/documents/pathwayReplan.ts
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker/routes/documents.ts worker/pathwayReplan.test.ts src/features/documents/StudyPathwayPreviewPanel.tsx src/features/explore/exploreApi.ts worker/lib/documents/pathwayReplan.ts
            git commit -m "Format linked study task consistency safeguards"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
