name: Format pathway release checks once
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/format-pathway-release-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write worker/migrations.test.ts worker/pathwayJourney.test.ts docs/D1_MIGRATIONS.md
      - name: Commit formatted release checks
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker/migrations.test.ts worker/pathwayJourney.test.ts docs/D1_MIGRATIONS.md
            git commit -m "Format pathway migration and PDF acceptance checks"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
