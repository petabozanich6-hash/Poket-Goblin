name: Format pathway Undo changes
on:
  push:
    branches:
      - feature/pathway-capacity-engine
    paths:
      - .github/workflows/format-pathway-undo-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/documents/StudyPathwayPreviewPanel.tsx worker/routes/documents.ts
      - name: Commit formatted changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/documents/StudyPathwayPreviewPanel.tsx worker/routes/documents.ts
            git commit -m "Format pathway Undo and approval flow"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
