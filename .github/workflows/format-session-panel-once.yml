name: Format saved-session panel once
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/format-session-panel-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/documents/StudyPathwayPreviewPanel.tsx
      - name: Commit formatted panel
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/documents/StudyPathwayPreviewPanel.tsx
            git commit -m "Format saved pathway management panel"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
