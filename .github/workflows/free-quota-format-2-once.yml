name: One-time Free quota formatting 2
on:
  push:
    branches: [feat/restrict-free-tier-foundation]
    paths: [.github/workflows/free-quota-format-2-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restrict-free-tier-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write worker/routes/captures.ts worker/routes/intelligence.ts
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/routes/captures.ts worker/routes/intelligence.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(plans): format alternate quota guards"
            git push origin HEAD:feat/restrict-free-tier-foundation
          fi
