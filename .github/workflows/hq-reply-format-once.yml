name: One-time reply pop-up format
on:
  push:
    branches: [fix/hq-reply-popup]
    paths: [.github/workflows/hq-reply-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hq-reply-popup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/support/SupportNotice.tsx worker/routes/support.ts
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/support/SupportNotice.tsx worker/routes/support.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(support): format HQ reply pop-up"
            git push origin HEAD:fix/hq-reply-popup
          fi
