name: Format final pathway audit edits
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/pathway-final-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npx prettier --write src/features/documents/DocumentDevourer.tsx worker/pathwayApproval.test.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/documents/DocumentDevourer.tsx worker/pathwayApproval.test.ts
            git commit -m "Format pathway review and account deletion safeguards"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
