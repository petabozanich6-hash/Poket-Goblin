name: Format pathway ordering changes
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/pathway-order-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format pathway ordering changes
        run: |
          npx prettier --write \
            worker/lib/documents/pathwayReplan.ts \
            worker/lib/documents/pathwayReplan.test.ts \
            worker/pathwayApproval.test.ts \
            worker/lib/documents/pathwayApproval.ts \
            worker/routes/documents.ts \
            src/features/explore/exploreApi.ts
      - name: Commit formatted code
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker/lib/documents/pathwayReplan.ts worker/lib/documents/pathwayReplan.test.ts worker/pathwayApproval.test.ts worker/lib/documents/pathwayApproval.ts worker/routes/documents.ts src/features/explore/exploreApi.ts
            git commit -m "Format study path reapproval and dependency ordering"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
