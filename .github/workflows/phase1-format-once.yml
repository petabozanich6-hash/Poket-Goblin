name: Phase 1 branch formatting
on:
  push:
    branches:
      - feature/pathway-capacity-engine
    paths:
      - .github/workflows/phase1-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format Phase 1 files
        run: |
          npx prettier --write \
            shared/documents/pathwayPreview.test.ts \
            shared/documents/pathwayPreview.ts \
            shared/documents/pathwayScheduler.test.ts \
            shared/documents/pathwayScheduler.ts \
            src/features/documents/DocumentDevourer.tsx \
            src/features/documents/StudyPathwayPreviewPanel.tsx \
            src/features/explore/exploreApi.ts \
            worker/lib/documents/autoAdd.ts \
            worker/lib/documents/processDocument.ts \
            worker/routes/documents.ts
      - name: Commit formatting to draft branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/documents/pathway* src/features/documents/DocumentDevourer.tsx src/features/documents/StudyPathwayPreviewPanel.tsx src/features/explore/exploreApi.ts worker/lib/documents/autoAdd.ts worker/lib/documents/processDocument.ts worker/routes/documents.ts
            git commit -m "Apply Prettier formatting to Phase 1 planner"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
