name: Format missed-day pathway work once
on:
  push:
    branches: [feature/pathway-capacity-engine]
    paths: [.github/workflows/replan-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pathway-capacity-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format added replanning implementation
        run: |
          npx prettier --write \
            shared/documents/pathwayPreview.ts \
            worker/lib/documents/pathwayApproval.ts \
            worker/lib/documents/pathwayReplan.ts \
            worker/lib/documents/pathwayReplan.test.ts \
            worker/pathwayReplan.test.ts \
            worker/routes/documents.ts \
            src/features/explore/exploreApi.ts \
            src/features/documents/StudyReplanPanel.tsx \
            src/features/documents/StudyPathwayPreviewPanel.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/documents/pathwayPreview.ts worker/lib/documents/pathwayApproval.ts worker/lib/documents/pathwayReplan.ts worker/lib/documents/pathwayReplan.test.ts worker/pathwayReplan.test.ts worker/routes/documents.ts src/features/explore/exploreApi.ts src/features/documents/StudyReplanPanel.tsx src/features/documents/StudyPathwayPreviewPanel.tsx
            git commit -m "Format missed-day replanning implementation"
            git push origin HEAD:feature/pathway-capacity-engine
          fi
