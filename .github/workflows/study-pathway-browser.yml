name: Study pathway browser acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [ready_for_review]
    branches: [main, development]
    paths:
      - 'e2e/study-pathway.spec.ts'
      - 'src/features/documents/**'
      - 'shared/documents/**'
      - 'worker/routes/documents.ts'
      - 'worker/lib/documents/**'
      - 'worker/lib/ics.ts'
      - 'migrations/**'
      - '.github/workflows/study-pathway-browser.yml'

permissions:
  contents: read

jobs:
  study-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure local-only credentials
        run: |
          printf 'ENVIRONMENT=development\nAUTH_SECRET=browser-test-only-not-for-production-1234567890\nAI_PROVIDER=none\n' > .dev.vars
      - name: Prepare isolated local database
        run: npm run db:migrate:local
      - name: Start isolated local servers and run browser acceptance
        run: |
          npm run dev > /tmp/pocket-goblin-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 55); do
            if curl --fail --silent http://localhost:5173/ > /dev/null &&
               curl --fail --silent http://localhost:8787/api/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Local browser test servers did not start.'
            cat /tmp/pocket-goblin-dev.log
            exit 1
          fi
          npx playwright test e2e/study-pathway.spec.ts --reporter=line || {
            cat /tmp/pocket-goblin-dev.log
            exit 1
          }
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: study-pathway-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
