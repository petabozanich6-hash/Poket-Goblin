# Temporary one-off development branch formatter. Remove after use.
name: Temporary Push Formatter
on:
  push:
    branches:
      - feature/opt-in-web-push
    paths:
      - .github/workflows/temp-push-format.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/opt-in-web-push
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed notification files
        run: |
          npx prettier --write \
            docs/WEB_PUSH.md \
            migrations/0024_web_push.sql \
            worker/lib/push.ts \
            worker/routes/push.ts \
            worker/push.test.ts \
            worker/env.ts \
            worker/index.ts \
            worker/routes/admin.ts \
            wrangler.toml \
            public/sw.js \
            src/pages/SettingsPage.tsx \
            src/features/pwa/PushControls.tsx \
            src/features/magical/NudgeTray.tsx
      - name: Commit format-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_PUSH.md migrations/0024_web_push.sql worker/lib/push.ts worker/routes/push.ts worker/push.test.ts worker/env.ts worker/index.ts worker/routes/admin.ts wrangler.toml public/sw.js src/pages/SettingsPage.tsx src/features/pwa/PushControls.tsx src/features/magical/NudgeTray.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(push): apply repository Prettier formatting"
            git push origin HEAD:feature/opt-in-web-push
          fi
