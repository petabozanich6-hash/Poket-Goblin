name: Temporary AI benchmark formatter
on:
  push:
    branches:
      - chore/manual-cloudflare-model-benchmarks-20261017
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/compare-pocket-ai.mjs scripts/compare-pocket-ai.test.mjs docs/MANUAL-AI-MODEL-COMPARISON.md .github/workflows/manual-compare-pocket-ai.yml
      - name: Commit formatted benchmark files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/compare-pocket-ai.mjs scripts/compare-pocket-ai.test.mjs docs/MANUAL-AI-MODEL-COMPARISON.md .github/workflows/manual-compare-pocket-ai.yml
          if ! git diff --cached --quiet; then
            git commit -m "Format manual AI benchmark tooling"
            git push origin HEAD:chore/manual-cloudflare-model-benchmarks-20261017
          fi
