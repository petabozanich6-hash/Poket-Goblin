name: Temporary AI baseline formatter
on:
  push:
    branches:
      - chore/ai-usage-performance-baseline-20261017

permissions:
  contents: write

jobs:
  format-ai-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format scoped baseline files
        run: npx prettier --write src/pages/hq/HqCostsPage.tsx worker/lib/aiTelemetry.ts worker/lib/aiTelemetry.test.ts
      - name: Commit formatted files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/hq/HqCostsPage.tsx worker/lib/aiTelemetry.ts worker/lib/aiTelemetry.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format AI telemetry and HQ view"
            git push origin HEAD:chore/ai-usage-performance-baseline-20261017
          fi
