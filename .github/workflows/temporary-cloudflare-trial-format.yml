name: Temporary Cloudflare trial formatter
on:
  push:
    branches:
      - feat/cloudflare-ai-model-trials-20261017
permissions:
  contents: write
jobs:
  format-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format scoped trial changes
        run: npx prettier --write docs/CLOUDFLARE-AI-MODEL-TRIALS.md worker/lib/intelligence/workersAi.ts worker/lib/intelligence/workersAi.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLOUDFLARE-AI-MODEL-TRIALS.md worker/lib/intelligence/workersAi.ts worker/lib/intelligence/workersAi.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Workers AI trial source and tests"
            git push origin HEAD:feat/cloudflare-ai-model-trials-20261017
          fi
