name: Temporary confirmation recovery formatter
on:
  push:
    branches:
      - security/verified-email-signup-20261016
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/AccountRecoveryPages.tsx
      - name: Commit formatted confirmation recovery page
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/pages/AccountRecoveryPages.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format expired-email-link resend UI"
            git push origin HEAD:security/verified-email-signup-20261016
          fi
