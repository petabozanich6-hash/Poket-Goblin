name: Temporary verification PR formatter

on:
  push:
    branches:
      - security/verified-email-signup-20261016

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply existing Prettier rules
        run: npx prettier --write src/pages/AuthPage.tsx worker/account.test.ts worker/routes/auth.ts
      - name: Commit formatting to this feature branch only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/pages/AuthPage.tsx worker/account.test.ts worker/routes/auth.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository Prettier formatting to email verification changes"
            git push origin HEAD:security/verified-email-signup-20261016
          fi
