name = "pocket-goblin"
main = "worker/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Local D1 only for now — do not provision remote paid resources without permission.
[[d1_databases]]
binding = "DB"
database_name = "pocket-goblin"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# R2 reserved for Sprint 4 document uploads — not provisioned yet.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "pocket-goblin-uploads"

[vars]
ENVIRONMENT = "development"

[dev]
port = 8787
