name = "pocket-goblin"
main = "worker/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Production: https://pocketgoblin.org is already attached to this Worker as a
# Custom Domain in the Cloudflare dashboard (DNS + SSL managed there).
# Deliberately NO `routes` / `custom_domain` entries here — `wrangler deploy`
# leaves dashboard-managed domains alone when the config declares none.
# See docs/DEPLOYMENT.md.

# React SPA (Vite build output) served by the same Worker as the API.
# - /api/* always runs the Hono Worker first.
# - Everything else is a static asset; unknown paths (e.g. /den, /login on
#   refresh) fall back to index.html so React Router can handle them.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Production D1 database. Schema changes go through the approval-gated
# "D1 migrations (production)" workflow — see docs/D1_MIGRATIONS.md.
[[d1_databases]]
binding = "DB"
database_name = "pocket-goblin"
database_id = "91a90710-dbd7-4a0c-8c90-b97cd3c86d90"
migrations_dir = "migrations"

# Production R2 bucket for document uploads. `wrangler dev --local` uses a
# Miniflare simulation. preview_bucket_name is only used by
# `wrangler dev --remote`; it deliberately is NOT the production bucket.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "pocket-goblin-uploads"
preview_bucket_name = "pocket-goblin-uploads-preview"

# Production by default, so every deploy path (Workers Builds, `wrangler
# deploy`) gets Secure cookies and production rate limits. Local development
# overrides this with ENVIRONMENT=development in .dev.vars.
[vars]
ENVIRONMENT = "production"
# Workers AI, exactly as activated in the Cloudflare dashboard on
# 2026-10-15. Kept here so automatic deploys from main don't remove them
# (deploys replace dashboard-only variables). Local dev uses .dev.vars.
AI_PROVIDER = "workers_ai"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
# Platform-wide AI calls per UTC day (cost guard; each person also has a
# daily limit by plan). Roughly a tenth of a cent per document read.
AI_DAILY_GLOBAL_LIMIT = "300"
# Stripe Premium price ids (not secret). Empty = Premium shows "Coming soon".
# The keys are Worker secrets: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
# Live keys stay refused until STRIPE_LIVE_ENABLED = "true" (owner approval).
STRIPE_PRICE_MONTHLY = ""
STRIPE_PRICE_YEARLY = ""

# Workers Logs: request + console logs in the dashboard (no extra resource).
[observability]
enabled = true

# Account emails (password reset, email verification) via Cloudflare Email
# Service. Sending needs pocketgoblin.org onboarded to Email Sending (owner
# action). Until then the app reports email as not configured.
[[send_email]]
name = "EMAIL"

# Hourly housekeeping: deletes abandoned "Just sort it" documents (originals
# older than 24 h) and unfinished uploads. Cron Triggers are free.
[triggers]
crons = ["17 * * * *"]

[dev]
port = 8787

# Workers AI binding (active in production since 2026-10-15; see
# docs/WORKERS_AI.md). `npm run dev` keeps AI off locally via
# --var AI_PROVIDER:none, so local runs never call remote GPUs.
[ai]
binding = "AI"
